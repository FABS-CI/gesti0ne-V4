name: k6 smoke load test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  k6-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Action officielle Grafana : binaire k6 téléchargé directement. Le dépôt apt
      # dl.k6.io est désormais signé par une autre clé (NO_PUBKEY C780D0BDB1A69C86)
      # et refusait l'installation.
      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 smoke scenario only
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:  ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_EMAIL:         ${{ secrets.K6_TEST_EMAIL }}
          TEST_PASSWORD:      ${{ secrets.K6_TEST_PASSWORD }}
          TEST_CLIENT_ID:     ${{ secrets.K6_TEST_CLIENT_ID }}
          BASE_URL:           ${{ secrets.K6_BASE_URL }}
        # PR = smoke uniquement (30s / 5 VUs). Le scénario "ramp" reste dispo
        # en manuel via workflow_dispatch en supprimant --exclude-scenarios.
        run: k6 run --exclude-scenarios=ramp scripts/load/k6-smoke.js

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: |
            summary.html
            summary.json
          if-no-files-found: ignore
