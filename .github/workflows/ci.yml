name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    name: TypeScript typecheck (tsgo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Bloque toute régression TS (TS2304 « Cannot find name », mauvais schéma search, etc.)
      - run: bun run typecheck

  unit:
    name: Unit + a11y (vitest + jest-axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run

  rls:
    name: RLS + RPC audit (psql)
    runs-on: ubuntu-latest
    # Requiert le secret SUPABASE_DB_URL (URL postgres d'une base de TEST, jamais la production :
    # l'audit y écrit des données). Sans le secret, le job est sauté avec un avertissement
    # au lieu de laisser la CI toujours rouge ; typecheck et tests unitaires restent bloquants.
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier présence du secret DB
        id: secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL absent — tests RLS/RPC NON exécutés. Ajoutez le secret (base de test) pour les activer."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install psql
        if: steps.secret.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Exécuter les tests RLS/RPC
        if: steps.secret.outputs.present == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/test-rls-audit.sql | tee rls-report.txt
      - name: Détecter les FAIL dans le rapport
        if: steps.secret.outputs.present == 'true'
        run: |
          if grep -Ei "^FAIL|EXCEPTION|ERROR:" rls-report.txt; then
            echo "::error::Test RLS/RPC en échec — publication bloquée."
            exit 1
          fi
      - name: Upload rapport RLS
        if: always() && steps.secret.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rls-audit-report
          path: rls-report.txt
          retention-days: 30

  e2e:
    name: Playwright e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    # Requiert le secret E2E_BASE_URL (application de TEST). Sans lui, le job est sauté
    # avec un avertissement, comme le job rls.
    steps:
      - name: Vérifier présence du secret E2E
        id: secret
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            echo "::warning::E2E_BASE_URL absent — tests e2e NON exécutés. Ajoutez le secret (application de test) pour les activer."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.present == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.secret.outputs.present == 'true'
      - if: steps.secret.outputs.present == 'true'
        run: bun install --frozen-lockfile
      - if: steps.secret.outputs.present == 'true'
        run: bunx playwright install --with-deps chromium
      - if: steps.secret.outputs.present == 'true'
        run: bunx playwright test --project=${{ matrix.project }}
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_CLIENT_URL: ${{ secrets.E2E_CLIENT_URL }}
      - name: Upload Playwright report
        if: always() && steps.secret.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 14
      - name: Upload Playwright traces & videos
        if: always() && steps.secret.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: test-results
          retention-days: 14

  deploy-guard:
    name: Deploy guard (bloque la publication en cas d'échec)
    needs: [typecheck, unit, rls, e2e]
    # always() : le garde s'exécute même si un job a échoué ou a été annulé,
    # pour échouer explicitement au lieu d'être simplement « ignoré ».
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le résultat de chaque job de test
        run: |
          echo "typecheck=${{ needs.typecheck.result }} unit=${{ needs.unit.result }} rls=${{ needs.rls.result }} e2e=${{ needs.e2e.result }}"
          if [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.unit.result }}" != "success" ] || \
             [ "${{ needs.rls.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::Au moins un job de test n'a pas réussi — publication bloquée."
            exit 1
          fi
          echo "Tous les tests (typecheck, unitaires, RLS/RPC, e2e) sont passés — publication autorisée."
